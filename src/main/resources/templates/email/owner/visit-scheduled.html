<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Veterinary Visit Scheduled</title>
</head>
<body>

<h2>Veterinary Visit Scheduled</h2>

<p>
    Dear <strong th:text="${ownerName}">John Doe</strong>,
</p>

<p>
    A veterinary visit has been successfully scheduled for your
    <span th:text="${petType}">cat</span>
    "<strong th:text="${petName}">Jessy</strong>"
</p>

<p>
    <strong>Veterinarian:</strong>
    <span th:text="${vetName}">Dr. Smith</span>
</p>

<p>
    <strong>Visit date:</strong>
    <span th:text="${#temporals.format(visitDate, 'EEEE, MMMM dd, yyyy HH:mm')}">Thursday, August 20, 2026 10:00</span>
</p>

<p>
    Please arrive a few minutes before the scheduled time.
</p>

<p>
    Best regards,<br>
    PetClinic Farzan6118
</p>

</body>
</html>
