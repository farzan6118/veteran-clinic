<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointment Scheduled</title>
</head>
<body>

<h2>New Veterinary Appointment</h2>

<p>
    Dear <strong th:text="${vetName}">John Due</strong>,
</p>

<p>
    A new veterinary appointment has been scheduled with you.
</p>

<p>
    <strong>Pet:</strong>
    <span th:text="${petName}">Jessy</span>
</p>

<p>
    <strong>Owner:</strong>
    <span th:text="${ownerName}">John Doe</span>
</p>

<p>
    <strong>Appointment date:</strong>
    <span th:text="${visitDate}">2026-08-20 10:00</span>
</p>

<p>
    Please review the appointment details before the scheduled time.
</p>

<p>
    Best regards,<br>
    PetClinic Farzan6118
</p>

</body>
</html>
