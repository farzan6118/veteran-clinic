<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Veterinary Appointment Rescheduled</title>
</head>
<body style="font-family:Arial,sans-serif;color:#24323d;background:#f4f7f8;padding:24px;">
<main style="max-width:620px;margin:auto;background:#fff;border:1px solid #d9e2e6;padding:28px;">
    <h2 style="margin-top:0;color:#176b87;">Appointment rescheduled</h2>
    <p>Dear <strong th:text="${vetName}">Dr. Smith</strong>, the appointment has been updated.</p>
    <table style="width:100%;border-collapse:collapse;margin:22px 0;">
        <tr>
            <th style="text-align:left;background:#eaf4f7;padding:10px;">Pet</th>
            <td style="padding:10px;border-bottom:1px solid #d9e2e6;" th:text="|${petName} (${petType})|">Jessy (Dog)
            </td>
        </tr>
        <tr>
            <th style="text-align:left;background:#eaf4f7;padding:10px;">Owner</th>
            <td style="padding:10px;border-bottom:1px solid #d9e2e6;" th:text="${ownerName}">John Doe</td>
        </tr>
        <tr>
            <th style="text-align:left;background:#eaf4f7;padding:10px;">Previous time</th>
            <td style="padding:10px;border-bottom:1px solid #d9e2e6;"
                th:text="${#temporals.format(oldVisitDate, 'EEEE, MMMM dd, yyyy HH:mm')}">Old time
            </td>
        </tr>
        <tr>
            <th style="text-align:left;background:#eaf4f7;padding:10px;">New time</th>
            <td style="padding:10px;" th:text="${#temporals.format(newVisitDate, 'EEEE, MMMM dd, yyyy HH:mm')}">New
                time
            </td>
        </tr>
    </table>
    <p>Please review the updated appointment details.</p>
    <p>Best regards,<br>PetClinic Farzan6118</p>
</main>

</body>
</html>
