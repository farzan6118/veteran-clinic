<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Veterinary Appointment Canceled</title>
</head>
<body style="font-family:Arial,sans-serif;color:#24323d;background:#f4f7f8;padding:24px;">
<main style="max-width:620px;margin:auto;background:#fff;border:1px solid #d9e2e6;padding:28px;">
    <h2 style="margin-top:0;color:#a33b3b;">Appointment cancelled</h2>
    <p>Dear <strong th:text="${vetName}">Dr. Smith</strong>, the following appointment was cancelled.</p>
    <table style="width:100%;border-collapse:collapse;margin:22px 0;">
        <tr>
            <th style="text-align:left;background:#f8eaea;padding:10px;">Pet</th>
            <td style="padding:10px;border-bottom:1px solid #d9e2e6;" th:text="|${petName} (${petType})|">Jessy (Dog)
            </td>
        </tr>
        <tr>
            <th style="text-align:left;background:#f8eaea;padding:10px;">Owner</th>
            <td style="padding:10px;border-bottom:1px solid #d9e2e6;" th:text="${ownerName}">John Doe</td>
        </tr>
        <tr>
            <th style="text-align:left;background:#f8eaea;padding:10px;">Scheduled time</th>
            <td style="padding:10px;border-bottom:1px solid #d9e2e6;"
                th:text="${#temporals.format(visitDate, 'EEEE, MMMM dd, yyyy HH:mm')}">Scheduled time
            </td>
        </tr>
        <tr>
            <th style="text-align:left;background:#f8eaea;padding:10px;">Reason</th>
            <td style="padding:10px;" th:text="${reason}">Not provided</td>
        </tr>
    </table>
    <p>The appointment time is now available for another booking.</p>
    <p>Best regards,<br>PetClinic Farzan6118</p>
</main>

</body>
</html>
