<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Checkup Reminder</title>
</head>
<body>

<h2>Checkup Reminder</h2>

<p>
    This is a reminder that
    <strong th:text="${petName}">Pet</strong>
    is due for a periodic checkup.
</p>

<p>
    Checkup date:
    <strong th:text="${checkupDate}">2026-08-20</strong>
</p>

<p>
    Please contact the clinic to schedule your appointment.
</p>

</body>
</html>
