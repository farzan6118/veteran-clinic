<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Visit Reminder</title>
</head>
<body>

<h2>Vet Visit Reminder</h2>

<p>
    This is a reminder for
    <strong th:text="${petName}">Pet</strong>'s upcoming visit.
</p>

<p>
    Vet:
    <strong th:text="${vetName}">Dr. Smith</strong>
</p>

<p>
    Visit date:
    <strong th:text="${visitDate}">2026-08-20 10:00</strong>
</p>

<p>
    Please arrive a few minutes early.
</p>

</body>
</html>
